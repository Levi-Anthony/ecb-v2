name: ECO-213 forward migration identity
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/eco-213-forward-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes supabase@2.118.0 migration new eco213_work_context
