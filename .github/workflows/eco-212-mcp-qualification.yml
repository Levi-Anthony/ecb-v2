name: ECO-212 MCP integration qualification

on:
  push:
    branches:
      - ci/eco-212-qualify

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck MCP
        run: npm run typecheck:mcp
      - name: Run MCP protocol and authorization tests
        run: npm run test:mcp
