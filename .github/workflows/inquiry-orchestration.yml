name: Ordinary inquiry orchestration
on:
  push:
    branches: [main]
    paths:
      - 'server.ts'
      - 'server/orchestration*.ts'
      - 'server/domain-admission.ts'
      - 'server/native-packages/**'
      - 'server/urg-core.ts'
      - 'tests/inquiry/**'
      - 'AGENTS.md'
      - 'docs/worker-entry-evidence-discovery.md'
      - 'docs/working-preferences-constructive-di.md'
      - 'docs/inquiry-orchestration.md'
      - 'research/formal-semantics/2026-10-11-PGO-Temporal-Reciprocal-Constitution-Repair.md'
      - 'research/formal-semantics/PGO-Directed-Situated-Referent-Orchestration-Profile-v0.1.md'
      - 'research/urg-kernel/State-Formal-Contract-v1.0.md'
      - 'research/urg-kernel/URG-Core-Register-B-Candidate-v1.0.md'
      - 'research/formal-semantics/Situated-Referent-Discovery-Frontier.md'
      - 'research/urg-kernel/Level-Quadrant-Formal-Contract-v1.0.md'
      - 'scripts/qualify-quadrant-disclosure.ts'
      - 'research/urg-kernel/Quadrant-Disclosure-Contract-v*.md'
      - 'package*.json'
      - '.github/workflows/inquiry-orchestration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server.ts'
      - 'server/orchestration*.ts'
      - 'server/domain-admission.ts'
      - 'server/native-packages/**'
      - 'server/urg-core.ts'
      - 'tests/inquiry/**'
      - 'AGENTS.md'
      - 'docs/worker-entry-evidence-discovery.md'
      - 'docs/working-preferences-constructive-di.md'
      - 'docs/inquiry-orchestration.md'
      - 'research/formal-semantics/2026-10-11-PGO-Temporal-Reciprocal-Constitution-Repair.md'
      - 'research/formal-semantics/PGO-Directed-Situated-Referent-Orchestration-Profile-v0.1.md'
      - 'research/urg-kernel/State-Formal-Contract-v1.0.md'
      - 'research/urg-kernel/URG-Core-Register-B-Candidate-v1.0.md'
      - 'research/formal-semantics/Situated-Referent-Discovery-Frontier.md'
      - 'research/urg-kernel/Level-Quadrant-Formal-Contract-v1.0.md'
      - 'scripts/qualify-quadrant-disclosure.ts'
      - 'research/urg-kernel/Quadrant-Disclosure-Contract-v*.md'
      - 'package*.json'
      - '.github/workflows/inquiry-orchestration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:inquiry
      - run: npm run test:inquiry
      - run: npm run qualify:quadrant
