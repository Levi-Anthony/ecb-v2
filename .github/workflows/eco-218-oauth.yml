name: ECO-218 ordinary OAuth qualification
on:
  push:
    branches: [main]
    paths: ['server.ts', 'server/domain-admission.ts', 'server/native-packages/**', 'server/oauth*.ts', 'api/**', 'server/open-brain-mcp/**', 'tests/eco-218/**', 'package*.json', 'vercel.json', '.github/workflows/eco-218-oauth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:oauth
      - run: npm run typecheck:mcp
      - run: npm run typecheck:circulation
      - run: npm run test:oauth
      - run: npm run test:mcp
      - run: npm run test:circulation

  brain-edge-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.5.6'
      - name: Install package dependencies for Deno Node-resolution compatibility
        run: npm ci --ignore-scripts
      - name: Verify Edge compatibility, stable replay and authentication
        run: deno test --no-check --frozen --allow-net --allow-env server/open-brain-mcp/index.test.ts
