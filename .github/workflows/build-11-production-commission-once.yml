name: BUILD 11 production commission once
# retry-after-secret-refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-11-production-commission-once.yml'

jobs:
  commission:
    runs-on: ubuntu-latest
    steps:
      - name: Commission environment-held runtime capability
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' https://vezxivrvhakclxuvxzso.supabase.co/functions/v1/ecb11-commission)"
          body="$(cat "$body_file")"
          rm -f "$body_file"
          printf 'HTTP %s\n%s\n' "$status" "$body"
          case "$body" in
            *'"status":"commissioned"'*|*'"status":"already_commissioned"'*) exit 0 ;;
            *'"status":"migration_not_ready"'*) exit 2 ;;
            *'"status":"missing_ecb_ordinary_db_key"'*) exit 3 ;;
            *) exit 1 ;;
          esac
