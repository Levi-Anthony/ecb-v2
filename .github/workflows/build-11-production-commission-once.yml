name: BUILD 11 production verification once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-11-production-commission-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify commissioned runtime and deployed MCP
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' https://vezxivrvhakclxuvxzso.supabase.co/functions/v1/ecb11-commission)"
          body="$(cat "$body_file")"
          rm -f "$body_file"
          printf 'HTTP %s\n%s\n' "$status" "$body"
          case "$body" in
            *'"status":"verified"'*) exit 0 ;;
            *) exit 1 ;;
          esac
